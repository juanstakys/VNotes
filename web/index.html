<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content,viewport-fit=cover"><meta name="theme-color" content="#f5f4ef"><meta name="description" content="A quiet place for things to do. Private, offline voice notes."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><title>VNotes</title></head>
<body>
<div class="app">
<nav role="tablist" aria-label="Notes"><button id="tab-list" role="tab" aria-controls="notes" aria-selected="true">TODO</button><button id="tab-deleted" role="tab" aria-controls="notes" aria-selected="false">DONE</button></nav>
<div id="update-banner" hidden>Update available. <button id="reload-update">Reload</button></div><main>
<section id="notes" role="tabpanel" aria-labelledby="tab-list" aria-live="polite"></section>
<div id="setup-card" class="setup-card"><p id="setup-status">Download English voice recognition to record offline.</p><button id="setup" class="text-button">Download model</button></div>
</main>
<footer><div id="error-panel" role="alert" hidden><p id="error-message"></p><button id="dismiss-error">Dismiss</button></div><button id="cancel-processing" hidden>Cancel transcription</button><div id="record-status" role="status" hidden></div><div id="retry" hidden><span>Recording saved for retry.</span> <button id="retry-audio">Retry</button> <button id="discard-audio">Discard</button></div>
<div class="bottom-controls"><button id="settings" class="round settings-button" aria-label="Settings" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m9 3-1 3-3 1v3l-2 2 2 2v3l3 1 1 3h6l1-3 3-1v-3l2-2-2-2V7l-3-1-1-3z"/><circle cx="12" cy="12" r="3"/></svg></button>
<form id="composer"><label class="sr-only" for="draft">New note</label><div class="input-slot"><textarea id="draft" rows="1" placeholder="Your task here…" maxlength="20000"></textarea><div id="recording-feedback" hidden><meter id="level-meter" aria-label="Microphone level" min="0" max="1" value="0"></meter><time id="record-time">0:00</time></div></div><button id="action" class="round" type="submit" aria-label="Record a note"></button><button id="cancel-record" type="button" aria-label="Cancel recording" hidden>×</button></form>
<div id="trash-tools" hidden><button id="empty-trash" class="round danger" aria-label="Permanently delete all done notes"></button></div></div></footer>
</div>
<dialog id="modal"><form id="modal-form"><div id="modal-content"></div><div id="modal-actions"></div></form></dialog>
<div id="toast" role="status" hidden><span></span><button hidden>Undo</button></div>
<script type="module" src="app.js"></script></body></html>
